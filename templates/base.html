<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Organize alunos, campanhas e contatos de mentoria MLP.">
  <meta name="author" content="Ponto de Apoio">
  <title>{% block title %}Ponto de Apoio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Ir para o conteúdo principal</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('dashboard') }}">Ponto de Apoio <span>MLP</span></a>
    <nav aria-label="Navegação principal">
      <a href="{{ url_for('dashboard') }}">Início</a>
      <a href="{{ url_for('students') }}">Alunos</a>
      <a href="{{ url_for('campaigns') }}">Campanhas</a>
      <a href="{{ url_for('import_students') }}">Importar planilha</a>
    </nav>
  </header>
  <main id="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Central de Outreaches{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><a class="brand" href="{{ url_for('dashboard') }}">Central de Outreaches <span>MLP</span></a>
  <nav><a href="{{ url_for('dashboard') }}">Início</a><a href="{{ url_for('students') }}">Alunos</a><a href="{{ url_for('campaigns') }}">Campanhas</a><a href="{{ url_for('import_students') }}">Importar planilha</a></nav>
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
</body></html>
